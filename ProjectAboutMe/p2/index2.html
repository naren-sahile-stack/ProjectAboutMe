<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✅ To-Do List</title>
    <link rel="stylesheet" href="style2.css" />
    <script src="script2.js" defer></script>
</head>
<body>

    <div class="todo-container">
        <h1>
            📋 My Tasks
            <span id="taskCounter">0</span>
        </h1>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Write a new task here..." />
            <button id="addBtn">➕ Add</button>
        </div>

        <ul class="task-list" id="taskList"></ul>

        <div class="footer-stats">
            <div class="stats">
                🗂️ <span id="totalTasks">0</span> tasks | ✅ <span id="completedTasks">0</span> completed
            </div>
            <button id="clearAllBtn">🗑️ Clear All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
